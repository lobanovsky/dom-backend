name: dom-backend

services:
  backend:
    build: .
    image: dom-backend
    container_name: dom-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # журнал ещё и в файл на хосте (./logs), чтобы он не пропадал при пересоздании контейнера
      LOG_FILE: /logs/dom-backend.log
    volumes:
      - ./logs:/logs
      # сертификат и секреты Sber API (по желанию), см. private/sber/instruction
      - ./secrets:/secrets:ro
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "1"
    networks:
      - dom-network

networks:
  dom-network:
    external: true
